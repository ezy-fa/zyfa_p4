<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/portal.css">
    <script defer src="../js/storage.js"></script><script defer src="../js/dashboard.js"></script>
