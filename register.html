<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Longcat</title>
    <link rel="stylesheet" href="../portal.css">
    <script defer src="../storage.js"></script><script defer src="../auth.js"></script>
</head>
<body class="auth-page">
    <a class="back-link" href="index.html">← Kembali ke Home</a>
  <main class="auth-card">
      <div class="auth-icon">🍓</div><h1>Buat Akun</h1><p>Daftar sebelum bermain</p>
      <form id="registerForm">
        <label for="registerName">Nama</label><input id="registerName" required placeholder="Nama kamu">
        <label for="registerUsername">Username</label><input id="registerUsername" required minlength="3" placeholder="Buat username">
        <label for="registerPassword">Password</label><input id="registerPassword" type="password" required minlength="4" placeholder="Minimal 4 karakter">
        <button class="btn primary full" type="submit">Daftar</button>
        <p class="form-message" id="registerMessage" aria-live="polite"></p>
      </form>
      <p>Sudah punya akun? <a href="login.html">Login</a></p>
    </main>

</body>
</html>
